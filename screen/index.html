<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%274%27 fill=%27%23f7f9fc%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%274.2%27 fill=%27none%27 stroke=%27%232f3aa8%27 stroke-width=%271.6%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%271.1%27 fill=%27%232f3aa8%27/%3E%3C/svg%3E">
<style>
/* =========================================================================================
   Loop Desk — one problem at a time, at the reader's pace.

   Colour carries meaning here, never decoration: every hue is one of the three ways a
   conversation can end, so the same colour always says the same thing. Proportions are
   drawn rather than spelled — a bar reads faster than "4.51%" and does not pretend to a
   precision the coverage cannot support. The figure itself is one click away, and arrives
   with its definition, its fidelity and what it excludes.

   One file, no build step, no network, no web fonts: it has to run untouched and offline
   on the sealed corpus.
   ========================================================================================= */
:root{
  /* how a conversation ended — the only source of hue in the product */
  --resolved:#2E9E6B; --resolved-soft:#E6F4EC;
  --handoff:#C98A22;  --handoff-soft:#FBF2E0;
  --abandoned:#CC5B45; --abandoned-soft:#FBEDEA;
  --refused:#6B5BD6;  --refused-soft:#EFECFC;
  --act:#2F3AA8;      --act-soft:#ECEEF9;

  --bg:#F7F9FC;
  --ink:#12161C; --ink-2:#48515C; --ink-3:#6E7884;
  --hair:rgba(18,22,28,.09); --hair-2:rgba(18,22,28,.05);

  --glass:rgba(255,255,255,.62);
  --glass-solid:rgba(255,255,255,.88);
  --glass-edge:rgba(255,255,255,.75);
  --shadow:0 1px 2px rgba(18,28,45,.04), 0 14px 44px rgba(18,28,45,.09);
  --shadow-pop:0 20px 60px rgba(18,28,45,.20);

  --r-control:12px; --r-card:20px; --r-stage:28px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
/* The wash behind the glass. Its hue is the state of the run: warm while decisions are
   outstanding, cooling to green once the last one is recorded. */
body::before{
  content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;
  background:
    radial-gradient(48% 42% at 22% 12%, var(--wash-a,rgba(201,138,34,.16)), transparent 70%),
    radial-gradient(44% 46% at 84% 78%, var(--wash-b,rgba(47,58,168,.12)), transparent 72%);
  transition:background 1.2s ease;
}
body[data-state="clear"]{
  --wash-a:rgba(46,158,107,.18); --wash-b:rgba(46,158,107,.08);
}
.tnum{font-variant-numeric:tabular-nums lining-nums}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--act);outline-offset:3px;border-radius:4px}

.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(28px) saturate(1.7);
  backdrop-filter:blur(28px) saturate(1.7);
  border:1px solid var(--glass-edge);
  box-shadow:var(--shadow);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:rgba(255,255,255,.93)}
}

/* ---- top bar ----------------------------------------------------------------------------- */
.bar{
  flex:0 0 auto;z-index:3;display:flex;align-items:center;gap:14px;
  padding:11px 20px;font-size:13px;color:var(--ink-2);
}
.bar .mark{display:flex;align-items:center;gap:8px;font-weight:650;color:var(--ink);font-size:14px}
.bar .ring{width:11px;height:11px;border-radius:50%;border:2px solid var(--act)}
.bar .sp{flex:1}
.bar .quiet{color:var(--ink-3)}
.bar code{font:11.5px var(--mono);color:var(--ink-3);background:rgba(18,22,28,.05);
  padding:3px 8px;border-radius:7px}

/* ---- room -------------------------------------------------------------------------------- */
.room{flex:1 1 auto;min-height:0;z-index:1;display:grid;
  grid-template-columns:minmax(320px,30%) 1fr;gap:16px;padding:0 16px 16px}
.ledger{min-height:0;overflow:auto;border-radius:var(--r-card);padding:20px 18px 24px}
.stage{min-height:0;overflow:hidden;border-radius:var(--r-stage);display:flex;flex-direction:column}

/* ---- ledger ------------------------------------------------------------------------------ */
.summary{font-size:16px;line-height:1.62;color:var(--ink);margin:0 0 22px;max-width:40ch}
.group{margin-bottom:22px}
.group h2{font-size:13px;font-weight:650;color:var(--ink-3);margin:0 0 9px;letter-spacing:0}
.row{
  width:100%;text-align:left;background:transparent;border:1px solid transparent;
  border-radius:var(--r-control);padding:11px 12px;cursor:pointer;display:block;
  transition:background .14s,border-color .14s;
}
.row:hover{background:rgba(255,255,255,.62);border-color:var(--hair-2)}
.row[aria-current="true"]{background:rgba(255,255,255,.9);border-color:var(--hair);
  box-shadow:0 1px 2px rgba(18,28,45,.05)}
.row .rt{font-size:14.5px;line-height:1.38;font-weight:550;display:flex;gap:8px;align-items:flex-start}
.row .rw{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.row .sev{flex:0 0 auto;width:7px;height:7px;border-radius:50%;margin-top:7px}
.row .tick{flex:0 0 auto;color:var(--resolved);font-weight:700}
.row.settled .rt{color:var(--ink-2);font-weight:450}
.miniband{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:8px;max-width:150px}
.miniband i{display:block;height:100%}
.miniband i.resolved{background:var(--resolved)}
.miniband i.handoff{background:var(--handoff)}
.miniband i.abandoned{background:var(--abandoned)}
.ctx .row .rt{font-weight:450;font-size:14px;color:var(--ink-2)}
.count{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---- stage: progress, slide, footer ------------------------------------------------------ */
.progress{flex:0 0 auto;display:flex;gap:5px;padding:16px 26px 0}
.progress button{flex:1 1 0;background:none;border:0;padding:0 0 7px;cursor:pointer;
  font-size:11.5px;color:var(--ink-3);text-align:left;min-width:0}
.progress button i{display:block;height:3px;border-radius:2px;background:rgba(18,22,28,.11);margin-bottom:6px}
.progress button[aria-current="true"]{color:var(--ink)}
.progress button[aria-current="true"] i{background:var(--act)}
.progress button.seen i{background:rgba(47,58,168,.34)}
.progress span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.slide{flex:1 1 auto;min-height:0;overflow:auto;padding:22px 26px 8px}
/* A short slide sits in the middle of the stage rather than clinging to the top edge,
   so a single sentence reads as deliberate instead of unfinished. */
.slide.mid{display:flex;flex-direction:column;justify-content:center}
.slide.enter{animation:rise .24s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.foot{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 26px 18px}
.foot .sp{flex:1}
.foot .hint{font-size:12.5px;color:var(--ink-3)}

/* ---- slide content ----------------------------------------------------------------------- */
.headline{font-size:34px;line-height:1.16;font-weight:620;letter-spacing:-.021em;
  margin:6px 0 18px;max-width:22ch}
.lede{font-size:17px;line-height:1.6;color:var(--ink-2);max-width:56ch;margin:0 0 18px}
.scope{font-size:13px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:7px 16px;align-items:center}
h3.sec{font-size:15px;font-weight:620;margin:0 0 4px}
p.body{font-size:15px;line-height:1.62;color:var(--ink-2);max-width:62ch;margin:0 0 14px}
.card{background:var(--glass-solid);border:1px solid var(--hair-2);border-radius:var(--r-card);
  padding:16px 18px;margin-bottom:12px}
.card.quiet{background:rgba(255,255,255,.5)}
.card > h3{margin-bottom:8px}

/* the outcome band — what became of those conversations */
.band{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:2px 0 10px}
.band i{display:block;height:100%}
.band i.resolved{background:var(--resolved)}
.band i.handoff{background:var(--handoff)}
.band i.abandoned{background:var(--abandoned)}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.key span{display:inline-flex;align-items:center;gap:7px}
.key b{width:9px;height:9px;border-radius:3px;display:inline-block}

/* effect rows: a label, a drawn proportion, a figure you can open */
.eff{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:baseline;
  padding:11px 0;border-top:1px solid var(--hair-2)}
.eff:first-of-type{border-top:0}
.eff .lab{font-size:14.5px;color:var(--ink);max-width:40ch}
.eff .val{font-size:20px;font-weight:600;letter-spacing:-.01em}
.sub{display:flex;align-items:center;gap:10px;margin-top:2px;flex-wrap:wrap}
.eff .sub{grid-column:1/-1}
.cap{font-size:12.5px;color:var(--ink-3)}

/* a drawn proportion */
.meter{background:none;border:0;padding:0;margin:0;cursor:pointer;display:flex;
  align-items:center;gap:9px;min-width:0;flex:1 1 auto;max-width:280px}
.meter .track{flex:1 1 auto;height:7px;border-radius:4px;background:rgba(18,22,28,.09);overflow:hidden}
/* a share small enough to round to nothing still has to be visible as something */
.meter .track i{display:block;height:100%;border-radius:4px;background:var(--act);min-width:3px}
.meter:hover .track{background:rgba(18,22,28,.14)}
.meter .track i.resolved{background:var(--resolved)}
.meter .track i.handoff{background:var(--handoff)}
.meter .track i.abandoned{background:var(--abandoned)}
.meter .track i.refused{background:var(--refused)}
.meter .track i.thin{opacity:.45}

/* paired comparison: where it sits now against where it should */
.pair{margin:4px 0 6px}
.pair .line{display:flex;align-items:center;gap:12px;padding:5px 0}
.pair .nm{font-size:13.5px;color:var(--ink-2);flex:0 0 120px}

.num{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;
  border-bottom:1px dotted rgba(18,22,28,.32)}
.num:hover{color:var(--act);border-bottom-color:var(--act)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{border:1px solid var(--hair);border-radius:99px;padding:4px 12px;font-size:13px;
  color:var(--ink-2);background:rgba(255,255,255,.6)}
.flag{border:1px solid rgba(201,138,34,.3);background:var(--handoff-soft);
  border-radius:var(--r-card);padding:14px 16px;margin-bottom:12px}
.flag h3{color:#8a5d0c}
.stop{border:1px solid rgba(204,91,69,.28);background:var(--abandoned-soft);
  border-radius:var(--r-card);padding:14px 16px;margin-bottom:12px}
.stop h3{color:#9b3d2a}
.good{border:1px solid rgba(46,158,107,.3);background:var(--resolved-soft);
  border-radius:var(--r-card);padding:14px 16px;margin-bottom:12px}

.evline{display:flex;gap:10px;font-size:14px;padding:9px 0;border-top:1px solid var(--hair-2);
  color:var(--ink-2);line-height:1.55}
.evline:first-child{border-top:0}
.evline .dot{color:var(--act);flex:0 0 auto}
.prov{font-size:12.5px;color:var(--ink-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:5px}
.tag{font-size:12px;border-radius:7px;padding:3px 9px;white-space:nowrap}
.tag.grey{background:rgba(18,22,28,.06);color:var(--ink-2)}
.tag.red{background:var(--abandoned-soft);color:#9b3d2a}
.tag.green{background:var(--resolved-soft);color:#1a6b45}
.tag.amber{background:var(--handoff-soft);color:#8a5d0c}
.tag.violet{background:var(--refused-soft);color:#4a3cab}

.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.node{border:1px solid var(--hair);border-radius:var(--r-control);padding:9px 13px;
  background:rgba(255,255,255,.66);max-width:210px}
.node .nk{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.node .nv{font-size:13.5px;font-weight:560;line-height:1.3}
.node.bad{background:var(--abandoned-soft);border-color:rgba(204,91,69,.25)}
.node.mid{background:var(--handoff-soft);border-color:rgba(201,138,34,.25)}
.node.fix{background:var(--act-soft);border-color:rgba(47,58,168,.25)}
.arrow{color:var(--ink-3)}

/* ---- buttons ----------------------------------------------------------------------------- */
.btn{border:1px solid var(--hair);background:rgba(255,255,255,.7);border-radius:var(--r-control);
  padding:10px 18px;font-size:14.5px;font-weight:560;cursor:pointer;
  transition:background .14s,border-color .14s,transform .06s}
.btn:hover{background:#fff}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:default}
.btn.go{background:var(--act);border-color:var(--act);color:#fff}
.btn.go:hover{background:#3a46c4}
.btn.no:hover{background:var(--abandoned-soft);border-color:rgba(204,91,69,.3);color:#9b3d2a}
.btn.sm{padding:7px 13px;font-size:13px}
.linky{background:none;border:0;padding:0;color:var(--act);font:inherit;font-weight:560;cursor:pointer}
.linky:hover{text-decoration:underline}
.expand{border:1px solid var(--hair);background:rgba(255,255,255,.6);border-radius:var(--r-control);
  padding:7px 13px;font-size:13px;color:var(--ink-2);cursor:pointer;margin-top:10px}
.expand:hover{background:#fff;color:var(--ink)}

/* ---- popover, modal, tooltip ------------------------------------------------------------- */
.pop{position:fixed;z-index:60;border-radius:var(--r-card);padding:16px 18px;max-width:430px;
  font-size:14px;background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  border:1px solid var(--glass-edge);box-shadow:var(--shadow-pop)}
.pop .pt{font-weight:650;margin-bottom:2px}
.pop .pv{font-size:26px;font-weight:620;letter-spacing:-.02em;margin-bottom:6px}
.pop dt{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:11px}
.pop dd{margin:2px 0 0;color:var(--ink-2);line-height:1.5}
.pop .lock{margin-top:14px;padding-top:11px;border-top:1px solid var(--hair-2);
  font-size:12.5px;color:var(--ink-3)}
.scrim{position:fixed;inset:0;background:rgba(18,28,45,.34);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:22px;
  animation:fade .14s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:rgba(255,255,255,.97);border:1px solid var(--glass-edge);
  border-radius:var(--r-stage);max-width:600px;width:100%;padding:24px 26px;max-height:86vh;
  overflow:auto;box-shadow:var(--shadow-pop)}
.modal h3{margin:0 0 6px;font-size:19px;font-weight:620}
.modal label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:16px 0 6px}
.modal input,.modal textarea{width:100%;font:15px var(--sans);padding:10px 12px;
  border:1px solid var(--hair);border-radius:var(--r-control);background:rgba(255,255,255,.8);color:var(--ink)}
.modal textarea{min-height:78px;resize:vertical}
.picks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.picks button{font-size:13px;padding:6px 13px;border:1px solid var(--hair);border-radius:99px;
  background:rgba(255,255,255,.7);cursor:pointer;color:var(--ink-2)}
.picks button:hover{background:#fff;color:var(--ink)}
.confirm{background:rgba(18,22,28,.045);border-radius:var(--r-control);padding:13px 15px;margin:16px 0;
  font:12.5px/1.8 var(--mono);color:var(--ink-2);white-space:pre-wrap}
.err{background:var(--abandoned-soft);border:1px solid rgba(204,91,69,.3);color:#9b3d2a;
  border-radius:var(--r-control);padding:11px 14px;margin-top:13px;font-size:14px}
.raw{font:12.5px/1.7 var(--mono);color:var(--ink-2);background:rgba(18,22,28,.045);
  border-radius:var(--r-control);padding:13px 15px;white-space:pre-wrap;overflow-x:auto}
.spec{font:12.5px/1.8 var(--mono);background:#12161C;color:#e2e8f4;border-radius:var(--r-control);
  padding:14px 16px;overflow-x:auto;white-space:pre;margin-top:10px}
#tip{position:fixed;z-index:70;max-width:290px;background:#12161C;color:#f2f5f9;font-size:12.5px;
  line-height:1.45;padding:9px 12px;border-radius:10px;box-shadow:var(--shadow-pop);
  pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .1s,transform .1s}
#tip.on{opacity:1;transform:none}

.empty{color:var(--ink-3);font-size:15px;max-width:56ch}
.loading{padding:70px 26px;color:var(--ink-3)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Below this width the two-pane console stops being a console and becomes an ordinary
   scrolling page: the panes stack, nothing clips, and the stage sizes to its content. */
@media (max-width:900px){
  html,body{height:auto;overflow:visible}
  body{display:block}
  .room{grid-template-columns:1fr;padding:0 12px 14px;min-height:0}
  .ledger,.stage{min-height:0;max-height:none;overflow:visible}
  .stage{display:block}
  .slide{overflow:visible;min-height:0;padding:18px 16px 4px}
  .slide.mid{display:block}
  .progress{padding:14px 16px 0}
  .progress button span{display:none}
  .progress button[aria-current="true"] span{display:block}
  .foot{padding:12px 16px 18px}
  .headline{font-size:26px;max-width:none}
  .lede,p.body{max-width:none}
  .bar{padding:10px 14px;flex-wrap:wrap}
  .eff .val{font-size:18px}
}
</style>
</head>
<body>
<header class="bar" id="bar"></header>
<main class="room">
  <aside class="ledger glass" id="ledger"><div class="loading">Reading the report…</div></aside>
  <section class="stage glass" id="stage"></section>
</main>
<div id="tip"></div>
<div id="overlay"></div>
<script>
/* Loop Desk. Everything on this page comes out of loop-report.json — no day, tenant,
 * cohort or metric name is written into this file, because the sealed run moves all of
 * them. If the report says something different, the screen says something different. */
'use strict';

var R=null, IDX=null, DECK=null;
var $=function(s,r){return (r||document).querySelector(s);};
var el=function(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
var esc=function(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;};
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- formatting -------------------------------------------------------------------- */
function fmtInt(n){return n==null?null:Number(n).toLocaleString('en-GB');}
function fmtPct(v,dp){return v==null?null:(v*100).toFixed(dp==null?1:dp)+'%';}
function fmtUsd(v){if(v==null)return null;v=Number(v);return '$'+(v>=100?Math.round(v).toLocaleString('en-GB'):v.toFixed(2));}
function sentence(s){s=String(s||'').trim();return s?s[0].toUpperCase()+s.slice(1):'';}
function fmtNum(v,dp){
  if(v==null)return null;
  if(Math.abs(v)>=1000)return Math.round(v).toLocaleString('en-GB');
  return String(Number(v).toFixed(dp==null?2:dp)).replace(/\.?0+$/,'')||'0';
}

/* ---------- indexing ---------------------------------------------------------------------- */
function buildIndex(rep){
  var byFinding={},byDiag={},byPres={},presById={},findingById={};
  (rep.diagnoses||[]).forEach(function(d){byFinding[d.finding_id]=d;});
  (rep.prescriptions||[]).forEach(function(p){byDiag[p.diagnosis_id]=p;presById[p.id]=p;});
  (rep.verifications||[]).forEach(function(v){(byPres[v.prescription_id]=byPres[v.prescription_id]||[]).push(v);});
  (rep.findings||[]).forEach(function(f){findingById[f.id]=f;});

  /* Per-tenant coverage for step-grain numbers. Metric ids carry the tenant slug, but the
     sealed run may name tenants differently, so fall back to any sub-1.0 coverage rather
     than claiming full coverage we cannot support. */
  var cov={};
  (rep.findings||[]).forEach(function(f){
    if(cov[f.tenant]!=null)return;
    var slug=String(f.tenant||'').replace(/\W+/g,'_'),hit=null,any=null;
    (rep.metrics||[]).forEach(function(m){
      var c=m.coverage||{};
      if(c.value==null)return;
      if(slug&&m.id&&m.id.indexOf(slug)>=0&&hit==null)hit={value:c.value,basis:c.basis,excluded:c.excluded||[]};
      if(c.value<1&&any==null)any={value:c.value,basis:c.basis,excluded:c.excluded||[]};
    });
    if(hit||any)cov[f.tenant]=hit||any;
  });
  var cal=null;
  (rep.metrics||[]).forEach(function(m){if(m.calibration&&cal==null)cal=m.calibration;});

  var regs=(rep.findings||[]).filter(function(f){return f.is_regression;});
  regs.sort(function(a,b){return (a.rank||99)-(b.rank||99);});
  return {byFinding:byFinding,byDiag:byDiag,byPres:byPres,presById:presById,
    findingById:findingById,cov:cov,cal:cal,regs:regs,
    dis:(rep.findings||[]).filter(function(f){return !f.is_regression;})};
}
function prescriptionFor(f){var d=IDX.byFinding[f.id];return d?IDX.byDiag[d.id]||null:null;}
function decided(p){return !!(p&&p.approval&&p.approval.verdict);}

/* ---------- the definition popover -------------------------------------------------------- */
/* Every figure on this page opens one of these. The number never appears without the
   three things that make it honest: where it came from, what share of traffic can even
   produce it, and how it was computed. */
function num(text,info,cls){
  var b=el('button','num'+(cls?' '+cls:''),text);
  b.type='button';b.setAttribute('aria-haspopup','dialog');

  return b;
}
function meter(fraction,tone,info,label){
  var b=el('button','meter');b.type='button';b.setAttribute('aria-haspopup','dialog');
  var track=el('div','track'),fill=el('i',tone||'');
  fill.style.width=(Math.max(0,Math.min(1,fraction||0))*100)+'%';
  track.appendChild(fill);b.appendChild(track);

}
function showPop(anchor,info){
  closePop();
  var p=el('div','pop');p.setAttribute('role','dialog');
  p.appendChild(el('div','pt',info.title||'This number'));
  if(info.value!=null)p.appendChild(el('div','pv tnum',info.value));
  var dl=el('dl');
  function row(k,v){if(v==null||v==='')return;dl.appendChild(el('dt',null,k));dl.appendChild(el('dd',null,v));}
  row('What it is',info.definition);
  var FID={measured:'Measured. Counted directly in the logs, so we know it happened.',
           derived:'Derived. Calculated from things we counted. No opinion involved.',
           judged:'Judged. A model read the conversation and formed a view.'};
  row('How we know it',FID[info.fidelity]||info.fidelity);
  if(info.coverage!=null){
    row('Coverage',fmtPct(info.coverage,0)+' of this deployment’s conversations can produce this number. '
      +(info.coverageBasis||''));
    if(info.coverage<1&&(info.excluded||[]).length)
      row('Left out',info.excluded.join('; ')+'. That traffic cannot produce this number at all, '
        +'so it is excluded rather than counted as zero.');
  }
  if(info.calibration){
    var ag=info.calibration.agreement;
    row('Calibration', ag>=0.995
      ? 'Suspiciously perfect ('+ag.toFixed(4)+'). Human reviewers disagree with each other, so '
        +'agreement this high means something is wrong, not that the judge is excellent.'
      : 'Agrees with human reviewers '+fmtPct(ag,0)+' of the time, across '+info.calibration.n
        +' labelled conversations'+(info.calibration.judge_version?' on judge '+info.calibration.judge_version:'')
        +'. Human labellers disagree with each other about 7.5% of the time, so 100% would be a bug.');
  }else if(info.fidelity==='judged'){
    row('Calibration','Not published. No human labels exist for this question in the kit, so no agreement is claimed.');
  }
  row('How it was computed',info.derivation);
  p.appendChild(dl);
  p.appendChild(el('div','lock','Definition frozen. This system proposes changes to the agent, never to the yardstick.'));
  document.body.appendChild(p);
  var r=anchor.getBoundingClientRect();
  var top=r.bottom+8,left=Math.min(r.left,window.innerWidth-p.offsetWidth-14);
  if(top+p.offsetHeight>window.innerHeight)top=Math.max(8,r.top-p.offsetHeight-8);
  p.style.top=top+'px';p.style.left=Math.max(8,left)+'px';
  setTimeout(function(){document.addEventListener('click',closePop,{once:true});},0);
}
function closePop(){var p=$('.pop');if(p)p.remove();}

/* ---------- honesty envelope for one series ----------------------------------------------- */
function envelope(f,meta){
  meta=meta||{};
  var tenantCov=IDX.cov[f.tenant];
  var out={fidelity:meta.fidelity||'derived',definition:meta.definition||''};
  if(meta.basis==='step'&&tenantCov){
    out.coverage=tenantCov.value;out.coverageBasis=tenantCov.basis;out.excluded=tenantCov.excluded||[];
  }else{
    out.coverage=1.0;
    out.coverageBasis='Every conversation can produce this number; nothing is excluded.';
    out.excluded=[];
  }
  out.calibration=out.fidelity==='judged'?IDX.cal:null;
  return out;
}

/* ---------- series metadata (for evidence lines the report did not annotate) --------------- */
var SESSION_META={
  's.resolved':['Resolution rate','measured','rate','Share of conversations that ended resolved.'],
  's.milestones_complete':['Journey completion','measured','rate','Share of conversations that reached every milestone their journey defines.'],
  's.handoff_unplanned':['Unplanned handoffs','measured','rate','Share of conversations handed to a person the journey never intended to involve.'],
  's.abandoned':['Abandonment','measured','rate','Share of conversations the customer left without resolving.'],
  's.turns':['Turns per conversation','measured','count','Back-and-forth exchanges before the conversation ended.'],
  's.duration_s':['Conversation length','measured','count','Seconds from first to last turn.'],
  's.cost_usd':['Cost per conversation','measured','usd','Model spend per conversation, summed over its model calls.'],
  's.tool_error_any':['Conversations hitting a tool error','derived','rate','Share of conversations with at least one tool call that did not return ok. Declared failures only: a tool returning success with an empty body counts as a success here.'],
  's.guardrail_any':['Conversations hitting a guardrail','measured','rate','Share of conversations where a guardrail fired.']
};
function guessMeta(series){
  if(SESSION_META[series]){
    var x=SESSION_META[series];
    return {plain:x[0],fidelity:x[1],unit:x[2],definition:x[3],basis:series==='s.cost_usd'?'step':'session'};
  }
  if(series.indexOf('s.quality_score')===0)
    return {plain:'Judged quality',fidelity:'judged',unit:'score',basis:'session',
      definition:'A model’s 1-5 score for the conversation, comparable only within one rubric version.'};
  if(series.indexOf('share:')===0)
    return {plain:'Share of traffic by '+series.split(':')[1],fidelity:'derived',unit:'rate',basis:'session',
      definition:'What proportion of traffic each value accounts for. A change here moves every total without anything getting better or worse.'};
  var NOUN={tool_call:'tool call',kb_lookup:'knowledge-base lookup',llm_call:'model call',guardrail:'guardrail',handoff:'handoff',turn:'turn'};
  var SUF={fail:['failure rate','measured','rate'],empty:['empty-response rate','derived','rate'],
    miss:['miss rate','measured','rate'],retry:['retry rate','measured','rate'],
    duration_ms:['response time','measured','ms'],timeout:['timeout rate','measured','rate'],
    blocked:['blocked rate','measured','rate'],top_score:['best match score','measured','score'],
    tokens:['tokens used','measured','count']};
  var parts=series.split('.');
  if(parts.length===2&&SUF[parts[1]]){
    var n=NOUN[parts[0]]||parts[0].replace(/_/g,' '),t=SUF[parts[1]];
    return {plain:n.charAt(0).toUpperCase()+n.slice(1)+' '+t[0],fidelity:t[1],unit:t[2],basis:'step',
      definition:'Measured on '+n+' steps in the agent’s execution log.'};
  }
  return {plain:series.replace(/^s\./,'').replace(/[_.]/g,' '),fidelity:'derived',unit:'count',basis:'session',
    definition:'Computed from the deployment’s own logs.'};
}
function metricMeta(metric){
  var m=String(metric||'');
  if(/resolution|contain/.test(m))return {plain:'Resolution rate',unit:'rate',better:'high'};
  if(/turn/.test(m))return {plain:'Turns to resolve',unit:'count',better:'low'};
  if(/quality/.test(m))return {plain:'Judged quality',unit:'score',better:'high'};
  if(/cost|spend/.test(m))return {plain:'Cost per conversation',unit:'usd',better:'low'};
  var g=guessMeta(m);return {plain:g.plain,unit:g.unit||'count',better:'high'};
}
function fmtBy(unit,v){
  if(v==null)return null;
  if(unit==='rate')return fmtPct(v,0);
  if(unit==='usd')return fmtUsd(v);
  if(unit==='ms')return Math.round(v).toLocaleString('en-GB')+' ms';
  return fmtNum(v,2);
}

var EV_RE=/^(\S+) on (.+?), days (\d+)-(\d+): ([\d.]+) -> ([\d.]+) \(([+-]?[\d.]+)%, z=([\d.]+)(?:, baseline: (.+?))?\)\s*$/;
function parseEvidence(s){
  var m=EV_RE.exec(s);
  if(!m)return {raw:s};
  return {series:m[1],where:m[2],from_day:+m[3],to_day:+m[4],base:parseFloat(m[5]),obs:parseFloat(m[6]),
    pct:parseFloat(m[7]),z:parseFloat(m[8]),raw:s};
}

/* 2 — what it did to people. */
function slideImpact(f){
  var imp=f.impact||{};
  var s=el('div');
  s.appendChild(el('h3','sec','What it did'));

  var band=f.outcome_band;
  if(band&&band.total){
    var card=el('div','card');
    var bar=el('div','band');
    (band.segments||[]).forEach(function(seg){
      var i=el('i');i.className=seg.key;
      i.style.width=(seg.count/band.total*100)+'%';
      bar.appendChild(i);
    });
    card.appendChild(bar);
    var key=el('div','key');
    (band.segments||[]).forEach(function(seg){
      var sp=el('span');var sw=el('b');sw.style.background='var(--'+seg.key+')';
      sp.appendChild(sw);
      sp.appendChild(num(fmtInt(seg.count)+' '+seg.label,{
        title:seg.label.charAt(0).toUpperCase()+seg.label.slice(1),value:fmtInt(seg.count),
        definition:band.caption,fidelity:'measured',coverage:1.0,
        coverageBasis:'How a conversation ended is recorded on every one of them.',
        derivation:imp.derivation}));
      key.appendChild(sp);
    });
    card.appendChild(key);
    s.appendChild(card);
  }

  var effects=f.effect_plain||[];
  if(effects.length){
    var list=el('div','card');
    effects.forEach(function(e){list.appendChild(effectRow(f,e));});
    s.appendChild(list);
  }else if(!band){
    s.appendChild(el('p','empty','This finding records no impact block, so there is nothing to show here rather than a blank figure.'));
  }

  if((f.audience||[]).length){
    var who=el('div','card quiet');
    who.appendChild(el('h3','sec','Who has to act'));

    var chips=el('div','chips');
    f.audience.forEach(function(a){chips.appendChild(el('span','chip',AUD[a]||a.replace(/_/g,' ')));});
    who.appendChild(chips);
    s.appendChild(who);
  }
  if(f.if_nothing_changes){
    var flag=el('div','flag');
    flag.appendChild(el('h3','sec','If nobody acts'));
    flag.appendChild(el('p','body',f.if_nothing_changes));
    s.appendChild(flag);
  }
  return s;
}
function effectRow(f,e){
  var imp=f.impact||{},down=imp.downstream||{};
  var row=el('div','eff');
  row.appendChild(el('div','lab',e.headline));

  var total=imp.conversations_affected;
  var value=null,share=null,tone='';
  if(e.key==='volume'){value=fmtInt(total);share=imp.share_of_traffic;}
  else if(e.key==='lost'){var l=down.would_have_resolved_at_baseline!=null?down.would_have_resolved_at_baseline:down.lost_resolutions_vs_baseline;
    value=fmtInt(l);share=total?l/total:null;tone='abandoned';}
  else if(e.key==='handoffs'){value=fmtInt(down.unplanned_handoffs);share=total?down.unplanned_handoffs/total:null;tone='handoff';}
  else if(e.key==='abandoned'){value=fmtInt(down.abandoned);share=total?down.abandoned/total:null;tone='abandoned';}
  else if(e.key==='duration'){value=fmtInt(imp.days_running)+' days';}
  else if(e.key==='cost'){var c=imp.cost_usd!=null?imp.cost_usd:down.avoidable_spend_usd;value=fmtUsd(c);}
  else if(e.key==='metric_move'){
    var mm=metricMeta(f.metric);
    value=fmtBy(mm.unit,f.observed);
    if(/turn/i.test(mm.plain)&&value!=null)value+=' turns';
  }

  var covT=IDX.cov[f.tenant];
  var stepGrain=(e.key==='cost');
  var info={title:e.headline,value:value,definition:e.detail,
    fidelity:e.key==='volume'||e.key==='duration'?'derived':'measured',
    coverage:stepGrain&&covT?covT.value:1.0,
    coverageBasis:stepGrain&&covT?covT.basis:'Recorded on every conversation in this slice.',
    excluded:stepGrain&&covT?covT.excluded:[],
    derivation:imp.derivation};
  row.appendChild(num(value||'not recorded',info,'val tnum'));

  if(share!=null){
    var sub=el('div','sub');
    sub.appendChild(meter(share,tone,{
      title:e.headline+', as a share',value:fmtPct(share,1),
      definition:e.detail,fidelity:'derived',coverage:1.0,
      coverageBasis:'Both the count and the total are taken from the same set of conversations.',
      derivation:imp.derivation}));
    sub.appendChild(el('span','cap',e.key==='volume'?'of the tenant’s traffic in these days':'of this slice'));
    row.appendChild(sub);
  }
  return row;
}

/* 3 — why it happened. */
function slideCause(f){

  if(f.cause_plain)s.appendChild(el('p','lede',f.cause_plain));

  var chain=el('div','chain');

  function arrow(){var a=el('span','arrow');a.textContent='→';return a;}
  chain.appendChild(node('bad','What broke',whereOf(f)));
  var att=d.attributed_change;
  chain.appendChild(arrow());
  chain.appendChild(node('mid','Traced to',att&&att.day!=null?('day '+att.day+', a '+String(att.kind||'configuration').replace(/_/g,' ')+' change'):'no change we can point at'));
  if(p){chain.appendChild(arrow());chain.appendChild(node('fix','Proposed',String(p.change_type||'').replace(/[._]/g,' ')));}
  s.appendChild(chain);

  if(d.confidence!=null){

    var line=el('div','sub');
    line.appendChild(meter(d.confidence,'',{
      title:'Diagnostic confidence',value:fmtPct(d.confidence,0),
      definition:'How strongly the measured signals point to this cause rather than the alternatives. Set by which signatures matched, not by a model’s opinion.',
      fidelity:'derived',coverage:1.0,
      coverageBasis:'Derived from the signals that fired during detection.',
      derivation:'Confidence recorded by the detector that raised this finding.'}));
    line.appendChild(el('span','cap',d.cause_class?('cause recorded as '+String(d.cause_class).replace(/[._]/g,' ')):''));

    s.appendChild(note);
  }
  return s;
}

/* 4 — the evidence, with the baseline named. */
function slideEvidence(f){
  var s=el('div');
  s.appendChild(el('h3','sec','The evidence'));
  if(f.baseline_plain)s.appendChild(el('p','lede',f.baseline_plain));

  if(f.observed!=null&&f.expected!=null){
    var mm=metricMeta(f.metric);
    var card=el('div','card');
    card.appendChild(el('h3','sec',mm.plain));
    var scale=Math.max(Math.abs(f.observed),Math.abs(f.expected))||1;
    var env=envelope(f,{fidelity:'measured',basis:'session'});
    var pair=el('div','pair');
    [['Now',f.observed,mm.better==='high'?'abandoned':'handoff'],
     ['Baseline',f.expected,'resolved']].forEach(function(r){
      var line=el('div','line');
      line.appendChild(el('span','nm',r[0]));
      line.appendChild(meter(Math.abs(r[1])/scale,r[2],{
        title:mm.plain+', '+r[0].toLowerCase(),value:fmtBy(mm.unit,r[1]),
        definition:r[0]==='Now'?'What this slice is doing inside the affected window.'
          :((f.baseline||{}).why||'What this slice should be doing.'),
        fidelity:env.fidelity,coverage:env.coverage,coverageBasis:env.coverageBasis,
        excluded:env.excluded,calibration:env.calibration,
        derivation:(f.impact||{}).derivation}));
      pair.appendChild(line);
    });
    card.appendChild(pair);
    if(f.baseline&&f.baseline.source)
      card.appendChild(el('p','body','Baseline taken from '+f.baseline.source+'.'));
    s.appendChild(card);
  }

  /* Coverage, said out loud rather than left in a popover. A number measured on three
     quarters of the traffic is a different claim from one measured on all of it, and the
     reader should not have to click to find that out. */
  var covT=IDX.cov[f.tenant];
  if(covT&&covT.value!=null&&covT.value<1){
    var cc=el('div','card quiet');
    cc.appendChild(el('h3','sec','How much of this traffic we can see at all'));
    var line=el('div','sub');
    line.appendChild(meter(covT.value,'refused',{
      title:'Coverage',value:fmtPct(covT.value,0),
      definition:'The share of this tenant’s conversations that can produce these numbers.',
      fidelity:'derived',coverage:covT.value,coverageBasis:covT.basis,excluded:covT.excluded||[],
      derivation:'Recomputed from this corpus, never assumed.'}));
    line.appendChild(el('span','cap','of '+(f.tenant||'this tenant')+'’s conversations'));
    cc.appendChild(line);
    cc.appendChild(el('p','body',(covT.excluded||[]).length
      ? 'Left out: '+covT.excluded.join('; ')+'. That traffic cannot produce these numbers at '
        +'all, so it is excluded from the denominator rather than counted as working fine.'
      : covT.basis||''));
    s.appendChild(cc);
  }

  var rows=(f.evidence||[]).map(parseEvidence);
  var numeric=rows.filter(function(r){return r.series;});
  if(numeric.length){
    var nc=el('div','card');
    numeric.slice(0,4).forEach(function(r){nc.appendChild(numericEvidence(f,r));});
    s.appendChild(nc);
  }
  var plain=(f.evidence||[]).filter(function(line){return !EV_RE.test(line);});
  if(plain.length){

function numericEvidence(f,r){

/* 5 — the fix, and whether it is proven. */
function slideFix(f){

        title:mm.plain+', '+r[0].toLowerCase(),value:fmtBy(mm.unit,r[1]),

          :'The baseline this fix is predicted to restore. Naming the target up front is what makes the claim checkable afterwards.',
        fidelity:'derived',coverage:1.0,

    s.appendChild(none);

}
function verification(v){
  var box=el('div',v.verdict==='improved'?'good':v.verdict==='regressed'?'stop':'card quiet');
  var VI={improved:'It worked',no_effect:'It changed nothing',regressed:'It made things worse'};
  box.appendChild(el('h3','sec',VI[v.verdict]||String(v.verdict||'')));
  if(v.before!=null&&v.after!=null){
    var mm=metricMeta(v.metric);
    var scale=Math.max(Math.abs(v.before),Math.abs(v.after))||1;
    var pair=el('div','pair');
    [['Before',v.before,'handoff'],['After',v.after,v.verdict==='improved'?'resolved':'abandoned']].forEach(function(r){
      var line=el('div','line');
      line.appendChild(el('span','nm',r[0]));
      line.appendChild(meter(Math.abs(r[1])/scale,r[2],{
        title:mm.plain+', '+r[0].toLowerCase(),value:fmtBy(mm.unit,r[1]),
        definition:'Returned by the replay service for the affected slice of traffic.',
        fidelity:'measured',coverage:1.0,
        coverageBasis:'Replayed over the same conversations the fault ran on.',
        derivation:'Replay run '+v.replay_run_id+', metric '+v.metric+'.'}));
      pair.appendChild(line);
    });

  }
  var prov=el('div','prov');
  if(v.golden_set_pass===true)prov.appendChild(el('span','tag green','known-good conversations unharmed'));

  if(v.prediction_error!=null)prov.appendChild(el('span','tag grey','we were out by '+v.prediction_error));
  if(v.replay_run_id)prov.appendChild(el('span','tag grey',v.replay_run_id));
  box.appendChild(prov);
  return box;
}

/* 6 — the decision. */
function slideDecide(f){
  var p=prescriptionFor(f);
  var s=el('div');

  if(!p){
    s.appendChild(el('p','empty','There is nothing to approve here. This finding is reported for routing, not for a change.'));
    return s;
  }
  var a=p.approval;
  if(a&&a.verdict){
    var WORD={accepted:['good','Accepted','approved for shipping'],
      rejected:['flag','Rejected','not shipped, and the reason is recorded'],
      deferred:['card quiet','Deferred','escalated, nothing changed']};
    var ui=WORD[a.verdict]||WORD.deferred;
    var box=el('div',ui[0]);
    box.appendChild(el('h3','sec',ui[1]+', '+ui[2]));
    box.appendChild(el('p','body',a.reason));
    box.appendChild(el('p','body',a.decided_by+', '+a.at
      +(a.confidence?' ('+a.confidence+' confidence)':'')));
    var hist=p.approval_history||[];
    var bound=hist.length?hist[hist.length-1].report_build:null;
    if(bound)box.appendChild(el('p','body',bound===R.report_build
      ? 'Recorded against the evidence on this screen.'
      : 'Recorded against an older build of the report. The evidence has been rebuilt since.'));
    var acts=el('div','chips');
    var ch=el('button','btn sm','Change this decision');ch.type='button';
    ch.onclick=function(){openDecision(f,p,null);};
    var vw=el('button','btn sm','See it in the report');vw.type='button';
    vw.onclick=function(){showWritten(p);};
    acts.appendChild(ch);acts.appendChild(vw);box.appendChild(acts);
    s.appendChild(box);
    var next=IDX.regs.filter(function(g){return !decided(prescriptionFor(g));})[0];
    if(next){
      var nb=el('button','btn','Next one needing you');nb.type='button';
      nb.style.marginTop='12px';nb.onclick=function(){goFromList('f',next.id);};
      s.appendChild(nb);
    }
    return s;
  }

  var recap=el('div','card');
  recap.appendChild(el('h3','sec','What you are approving'));
  recap.appendChild(el('p','body',(p.decision&&p.decision.asking_approval_for)||p.description||''));
  s.appendChild(recap);

  var acts=el('div','chips');
  var yes=el('button','btn go',f.needs_your_inference?'Record what you think':'Approve the fix');
  yes.type='button';yes.onclick=function(){openDecision(f,p,'accepted');};
  var no=el('button','btn no','Reject');no.type='button';no.onclick=function(){openDecision(f,p,'rejected');};
  var later=el('button','btn','Defer');later.type='button';later.onclick=function(){openDecision(f,p,'deferred');};
  acts.appendChild(yes);acts.appendChild(no);acts.appendChild(later);
  acts.style.marginTop='4px';
  s.appendChild(acts);
  s.appendChild(el('p','body','Your name, your reason and the time go into the report, tied to this exact build of the evidence. A reasoned rejection is as complete an answer as an approval.'));
  return s;
}

/* ========================================================================================== *
 *  THE DECK — sequences, routing, keyboard
 * ========================================================================================== */
function slidesFor(seq,key){
  var out=[];
  function add(id,title,render){out.push({id:id,title:title,render:render});}
  if(seq==='f'){
    var f=IDX.findingById[key];
    if(!f)return [];
    add('problem','The problem',function(){return slideProblem(f);});
    add('impact','What it did',function(){return slideImpact(f);});
    if(!f.needs_your_inference)add('cause','Why',function(){return slideCause(f);});
    add('evidence','The evidence',function(){return slideEvidence(f);});
    if(prescriptionFor(f)&&!f.needs_your_inference)add('fix','The fix',function(){return slideFix(f);});
    add('decide','Decide',function(){return slideDecide(f);});
    return out;
  }
  if(seq==='dismissed'){
    IDX.dis.forEach(function(f,i){
      add('d'+i,titleOf(f).slice(0,26),function(){return slideDismissed(f);});
    });
    return out;
  }
  if(seq==='gaps'){
    (R.gaps||[]).forEach(function(g,i){
      add('g'+i,g.ask_id||('question '+(i+1)),function(){return slideGap(g);});
    });
    return out;
  }
  if(seq==='hitrate'){add('hr','How often we are right',slideHitRate);return out;}
  if(seq==='about'){add('ab','What this really does',slideAbout);return out;}
  return out;
}

function go(seq,key,i){
  location.hash='#/'+seq+(key?'/'+encodeURIComponent(key):'')+'/'+(i||0);
}
/* Stacked on a phone, the list fills the screen and the slide opens off-screen below it. */
function goFromList(seq,key){
  go(seq,key,0);
  if(window.innerWidth<=900){
    var stage=$('#stage');
    if(stage&&stage.scrollIntoView)stage.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'});
  }
}
function readHash(){
  var m=/^#\/([a-z]+)(?:\/([^/]+))?(?:\/(\d+))?$/.exec(location.hash||'');
  if(!m)return null;
  var seq=m[1],key=m[2]?decodeURIComponent(m[2]):null,i=m[3]?parseInt(m[3],10):0;
  if(seq!=='f'&&m[2]&&!m[3])i=parseInt(m[2],10)||0;
  return {seq:seq,key:seq==='f'?key:null,i:i};
}
function defaultDeck(){
  var open=IDX.regs.filter(function(f){return !decided(prescriptionFor(f));});
  var first=open[0]||IDX.regs[0];
  if(first)return {seq:'f',key:first.id,i:0};
  if(IDX.dis.length)return {seq:'dismissed',key:null,i:0};
  return {seq:'about',key:null,i:0};
}

function safeRender(slide){
  try{
    var node=slide.render();
    if(node)return node;
  }catch(e){
    if(window.console)console.error('slide failed',slide.id,e);
  }
  var s=el('div');
  s.appendChild(el('p','empty','This report does not carry what this slide would show. Nothing is being hidden; there is no data behind it.'));
  return s;
}

function renderStage(){
  var stage=$('#stage');stage.innerHTML='';
  var slides=slidesFor(DECK.seq,DECK.key);
  if(!slides.length){
    var empty=el('div','slide');
    empty.appendChild(el('p','empty','Nothing to show here on this run.'));
    stage.appendChild(empty);
    return;
  }
  if(DECK.i>=slides.length)DECK.i=slides.length-1;
  if(DECK.i<0)DECK.i=0;

  var prog=el('div','progress');
  slides.forEach(function(sl,n){
    var b=el('button');b.type='button';
    b.setAttribute('aria-current',n===DECK.i?'true':'false');
    if(n<DECK.i)b.className='seen';
    b.appendChild(el('i'));
    b.appendChild(el('span',null,sl.title));
    b.onclick=function(){go(DECK.seq,DECK.key,n);};
    prog.appendChild(b);
  });
  stage.appendChild(prog);

  var body=el('div','slide enter');
  body.appendChild(safeRender(slides[DECK.i]));
  stage.appendChild(body);
  if(body.scrollHeight<=body.clientHeight)body.classList.add('mid');

  var foot=el('div','foot');
  var back=el('button','btn sm','Back');back.type='button';back.disabled=DECK.i===0;
  back.onclick=function(){go(DECK.seq,DECK.key,DECK.i-1);};
  foot.appendChild(back);
  var next=el('button','btn sm'+(DECK.i===slides.length-1?'':' go'),
    DECK.i===slides.length-1?'Back to the list':'Next');
  next.type='button';
  next.onclick=function(){
    if(DECK.i===slides.length-1){var d=defaultDeck();go(d.seq,d.key,d.i);}
    else go(DECK.seq,DECK.key,DECK.i+1);
  };
  foot.appendChild(next);
  foot.appendChild(el('span','sp'));
  if(DECK.i<slides.length-1)foot.appendChild(el('span','hint','Next: '+slides[DECK.i+1].title));
  stage.appendChild(foot);
}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if($('.pop'))return closePop();
    if($('#overlay').innerHTML)return closeModal();
    return;
  }
  if($('#overlay').innerHTML)return;
  if(/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||''))return;
  var slides=DECK?slidesFor(DECK.seq,DECK.key):[];
  if(e.key==='ArrowRight'&&DECK&&DECK.i<slides.length-1)go(DECK.seq,DECK.key,DECK.i+1);
  if(e.key==='ArrowLeft'&&DECK&&DECK.i>0)go(DECK.seq,DECK.key,DECK.i-1);
});

/* ---------- the decision write path ------------------------------------------------------- */
var PICKS={
  accepted:['The evidence is clear','Cheap and easy to undo','The replay result convinces me'],
  rejected:['The diagnosis does not convince me','Too risky to ship','Not worth the effort',
            'Another team owns this','Known-good conversations regressed'],
  deferred:['Need the owning team to confirm','Waiting on a business call','Want a narrower fix first']

function closeModal(){$('#overlay').innerHTML='';}
function openDecision(f,p,verdict){
  var ov=$('#overlay');ov.innerHTML='';
  var scrim=el('div','scrim'),m=el('div','modal');
  var state={verdict:verdict||'accepted',confidence:null};

    var b=el('button',null,pair[1]);b.type='button';vb[pair[0]]=b;
    b.onclick=function(){state.verdict=pair[0];paint();};vrow.appendChild(b);
  });
  m.appendChild(vrow);

  m.appendChild(el('label',null,'How sure are you'));
  var crow=el('div','picks'),cb={};
  [['low','Low'],['medium','Medium'],['high','High']].forEach(function(pair){
    var b=el('button',null,pair[1]);b.type='button';cb[pair[0]]=b;
    b.onclick=function(){state.confidence=pair[0];paint();};crow.appendChild(b);
  });
  m.appendChild(crow);
  m.appendChild(el('p','body','This is your own confidence in this call, not the system’s '
    +'confidence in its diagnosis. The two are kept apart on purpose.'));

  m.appendChild(el('label',null,'Your name or email'));
  var who=el('input');try{who.value=localStorage.getItem('loopdesk.who')||'';}catch(e){}
  who.placeholder='ops.lead@example.com';m.appendChild(who);

  var rlabel=el('label',null,'Reason');m.appendChild(rlabel);
  var quick=el('div','picks');m.appendChild(quick);
  var why=el('textarea');
  why.placeholder=inference?'What do you think caused this? It is kept with the finding.'
    :'Why this decision? It goes into the report.';
  m.appendChild(why);
  var conf=el('div','confirm');m.appendChild(conf);
  var errBox=el('div');m.appendChild(errBox);

  var acts=el('div','picks');acts.style.marginTop='18px';
  var cancel=el('button','btn','Cancel');cancel.type='button';cancel.onclick=closeModal;
  var go2=el('button','btn go','Record it');go2.type='button';
  acts.appendChild(cancel);acts.appendChild(go2);m.appendChild(acts);

  function paint(){
    ['accepted','rejected','deferred'].forEach(function(v){
      var on=v===state.verdict;
      vb[v].style.background=on?'var(--act)':'rgba(255,255,255,.7)';
      vb[v].style.color=on?'#fff':'var(--ink-2)';

      cb[v].style.borderColor=on?'var(--act)':'var(--hair)';
    });
    rlabel.textContent=inference?'What you think (required)':'Reason (required)';
    quick.innerHTML='';
    if(!inference)(PICKS[state.verdict]||[]).forEach(function(r){
      var b=el('button',null,r);b.type='button';
      b.onclick=function(){if(!why.value)why.value=r;why.focus();};quick.appendChild(b);
    });
    conf.textContent='writes to  prescriptions['+p.id+'].approval\n'
      +'verdict    '+state.verdict+'\n'
      +'confidence '+(state.confidence||'(not set)')+'\n'
      +'change     '+p.change_type+' on '+p.target+'\n'
      +'against    build '+(R.report_build||'n/a')+'\n'
      +'checked    before anything is saved';
  }
  paint();

  go2.onclick=function(){
    errBox.innerHTML='';
    if(!who.value.trim()){errBox.appendChild(el('div','err','Your name is needed. An unsigned decision is not a decision.'));return;}
    if(!state.confidence){errBox.appendChild(el('div','err','Pick how sure you are. A decision with no stated confidence hides how much to trust it.'));return;}
    if(!why.value.trim()){errBox.appendChild(el('div','err','A reason is needed. A rejection with a good reason counts for as much as an approval, but a decision with no reason is not a record.'));return;}
    try{localStorage.setItem('loopdesk.who',who.value.trim());}catch(e){}
    go2.disabled=true;go2.textContent='Writing…';
    fetch('/decision',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prescription_id:p.id,verdict:state.verdict,decided_by:who.value.trim(),
        confidence:state.confidence,reason:why.value.trim(),report_build:R.report_build})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        go2.disabled=false;go2.textContent='Record it';
        if(!res.ok){
          errBox.appendChild(el('div','err',(res.j.error||'the write failed')+' '+(res.j.detail||'')));
          return;
        }
        closeModal();
        load(function(){showWritten(IDX.presById[p.id],res.j);});
      })
      .catch(function(e){
        go2.disabled=false;go2.textContent='Record it';
        errBox.appendChild(el('div','err','Could not reach the server. The page is open without screen/serve.py running, so nothing can be written. ('+e+')'));
      });
  };
  scrim.appendChild(m);scrim.onclick=function(e){if(e.target===scrim)closeModal();};
  ov.appendChild(scrim);who.focus();
}
function showWritten(p,res){
  var ov=$('#overlay');ov.innerHTML='';
  var scrim=el('div','scrim'),m=el('div','modal');
  m.appendChild(el('h3',null,'Written into the report'));
  m.appendChild(el('p','body','This is the file the judges open. '+((res&&res.path)||'engine/out/loop-report.json')));
  m.appendChild(el('div','raw','"approval": '+JSON.stringify((p||{}).approval,null,2)));
  m.appendChild(el('p','body','The report was re-checked after this was written. Had it failed that check, nothing would have been saved.'));
  var acts=el('div','picks');acts.style.marginTop='16px';
  var b=el('button','btn go','Close');b.type='button';b.onclick=closeModal;acts.appendChild(b);m.appendChild(acts);
  scrim.appendChild(m);scrim.onclick=function(e){if(e.target===scrim)closeModal();};ov.appendChild(scrim);
}

/* ---------- small shared pieces ----------------------------------------------------------- */
function expandModal(title,text){
  var ov=$('#overlay');ov.innerHTML='';
  var scrim=el('div','scrim'),m=el('div','modal');
  m.appendChild(el('h3',null,title));
  m.appendChild(el('div','raw',text));
  var acts=el('div','picks');acts.style.marginTop='16px';
  var b=el('button','btn go','Close');b.type='button';b.onclick=closeModal;acts.appendChild(b);m.appendChild(acts);
  scrim.appendChild(m);scrim.onclick=function(e){if(e.target===scrim)closeModal();};ov.appendChild(scrim);
}
function bindTip(node,text){
  node.setAttribute('title',text);
  node.addEventListener('mouseenter',function(){showTip(node,text);});
  node.addEventListener('mouseleave',hideTip);
  node.addEventListener('focus',function(){showTip(node,text);});
  node.addEventListener('blur',hideTip);
}
function showTip(node,text){
  var t=$('#tip');t.textContent=text;t.classList.add('on');
  var r=node.getBoundingClientRect();
  t.style.left='-9999px';t.style.top='0px';
  var tw=t.offsetWidth,th=t.offsetHeight;
  var left=Math.min(Math.max(8,r.left),window.innerWidth-tw-8);
  var top=r.bottom+8;
  if(top+th>window.innerHeight-8)top=r.top-th-8;
  t.style.left=left+'px';t.style.top=top+'px';
}
function hideTip(){var t=$('#tip');if(t)t.classList.remove('on');}

/* ---------- boot -------------------------------------------------------------------------- */
function render(){
  DECK=readHash()||DECK||defaultDeck();
  if(DECK.seq==='f'&&!IDX.findingById[DECK.key])DECK=defaultDeck();
  renderBar();renderLedger();renderStage();
}
function load(then){
  fetch('/report',{cache:'no-store'}).then(function(r){return r.json();})
    .then(function(rep){
      if(rep&&rep.error)throw new Error(rep.error+' — '+(rep.hint||rep.detail||''));
      R=rep;IDX=buildIndex(R);
      render();
      if(then)then();
    })
    .catch(function(e){
      $('#ledger').innerHTML='<h1 class="headline">No report to read.</h1>'
        +'<p class="empty">'+esc(String(e))+'</p>'
        +'<div class="raw">python3 -m engine.cli --kit nexus-loop-day1/kit --team solo --out engine/out/loop-report.json\n'
        +'python3 screen/serve.py --report engine/out/loop-report.json</div>';
      $('#stage').innerHTML='';
    });
}
window.addEventListener('hashchange',function(){if(IDX)render();});
window.addEventListener('resize',hideTip);
load();
</script>
</body>
